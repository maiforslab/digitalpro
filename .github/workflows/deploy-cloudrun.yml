name: Deploy to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  PROJECT_ID: falah-os
  REGION: us-central1
  SERVICE: falahos
  IMAGE: gcr.io/falah-os/falahos

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image via Cloud Build
        run: |
          gcloud builds submit \
            --project $PROJECT_ID \
            --tag $IMAGE \
            falah-os-workspace/

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --project $PROJECT_ID \
            --image $IMAGE \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 60

      - name: Print URL
        run: |
          URL=$(gcloud run services describe $SERVICE \
            --project $PROJECT_ID \
            --region $REGION \
            --format "value(status.url)")
          echo "Falah OS live at: $URL"
